name: Deploy surrentech.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surrentech-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: PHP syntax and application checks
        run: |
          php scripts/build-page.php
          find public tests scripts -name '*.php' -exec php -l {} \;
          python3 tests/test_php.py
      - name: Check deployment credentials
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_USERNAME" || { echo "::error::Configure FTP_USERNAME."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Configure FTP_PASSWORD."; exit 1; }
      - name: Deploy PHP to HostingInIndia cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server106.iabhost.com
          port: 21
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            **/.git**
            **/.DS_Store
            .env
            .env.example
            tmp/**
            _vendor*/**
            *.sqlite3
            stderr.log
      - name: Verify live site
        run: |
          curl -fsS --max-time 20 https://surrentech.com/ -o /tmp/surrentech-home.html
          grep -q 'Surren Technologies' /tmp/surrentech-home.html
          curl -fsS --max-time 20 https://www.surrentech.com/ -o /dev/null
          curl -fsS --max-time 20 https://surrentech.com/assets/logo.png -o /dev/null
      - name: Verify live PHP backend
        run: curl -fsS --retry 4 --retry-all-errors --retry-delay 5 --max-time 20 https://surrentech.com/healthz | grep -qx 'ok'
